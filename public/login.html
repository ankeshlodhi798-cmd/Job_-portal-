<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — USAJobsPro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50 min-h-screen flex items-center justify-center p-4"><main class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md"><a href="index.html" class="text-blue-600 text-sm">← Back to jobs</a><h1 class="text-3xl font-bold mt-5">Welcome to USAJobsPro</h1><p class="text-gray-500 mt-2 mb-6">Login or create an account.</p><input id="name" placeholder="Name (for new account)" class="w-full border p-3 rounded-lg mb-3"><input id="email" type="email" placeholder="Email" class="w-full border p-3 rounded-lg mb-3"><input id="pass" type="password" placeholder="Password (6+ characters)" class="w-full border p-3 rounded-lg mb-3"><select id="role" class="w-full border p-3 rounded-lg mb-4"><option value="jobseeker">Job seeker</option><option value="employer">Employer</option></select><div class="grid grid-cols-2 gap-2"><button onclick="login()" class="bg-blue-600 text-white p-3 rounded-lg font-bold">Login</button><button onclick="register()" class="border p-3 rounded-lg font-bold">Register</button></div><p id="msg" class="text-sm mt-4 text-center"></p></main><script>const API_URL='https://usajobspro.onrender.com';function fields(){return{name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value,role:document.getElementById('role').value}}async function register(){try{const r=await fetch(`${API_URL}/api/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields())});const d=await r.json();document.getElementById('msg').textContent=d.message;if(d.success)login()}catch(e){msg.textContent='Backend unavailable.'}}async function login(){try{const f=fields();const r=await fetch(`${API_URL}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.email,password:f.password})});const d=await r.json();if(!d.success){msg.textContent=d.message;return}localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));location.href=new URLSearchParams(location.search).get('next')==='post'?'index.html':'resume-ai.html'}catch(e){msg.textContent='Backend unavailable.'}}</script></body></html>
