<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — USAJobsPro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><header class="bg-gray-900 text-white p-4"><div class="max-w-6xl mx-auto flex justify-between"><b>USAJobsPro Admin</b><a href="index.html">Jobs</a></div></header><main class="max-w-6xl mx-auto p-6"><div class="flex justify-between mb-6"><h1 class="text-3xl font-bold">Dashboard</h1><button onclick="loadStats()" class="bg-gray-900 text-white px-4 py-2 rounded-lg">Refresh</button></div><div class="grid md:grid-cols-3 gap-5 mb-6"><div class="bg-white p-6 rounded-xl shadow"><p class="text-gray-500">Total Jobs</p><b id="totalJobs" class="text-3xl">0</b></div><div class="bg-white p-6 rounded-xl shadow"><p class="text-gray-500">Premium Jobs</p><b id="premiumJobs" class="text-3xl">0</b></div><div class="bg-white p-6 rounded-xl shadow"><p class="text-gray-500">Recorded Earnings</p><b id="earning" class="text-3xl text-green-600">$0</b></div></div><section class="bg-white p-5 rounded-xl shadow overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="p-3">Job</th><th class="p-3">Company</th><th class="p-3">Location</th><th class="p-3">Action</th></tr></thead><tbody id="jobsTable"><tr><td colspan="4" class="p-8 text-center">Loading...</td></tr></tbody></table></section></main><script>const API_URL='https://usajobspro.onrender.com';async function loadStats(){const token=localStorage.getItem('token');if(!token){location.href='login.html';return}try{const r=await fetch(`${API_URL}/api/admin/stats`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.message);totalJobs.textContent=d.totalJobs;premiumJobs.textContent=d.premiumJobs;earning.textContent='$'+d.totalEarning;jobsTable.innerHTML=d.allJobs.map(j=>`<tr class="border-b"><td class="p-3">${esc(j.title)}</td><td class="p-3">${esc(j.company)}</td><td class="p-3">${esc(j.location||'')}</td><td class="p-3"><button class="text-red-600" onclick="deleteJob('${j._id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="p-8 text-center">No jobs</td></tr>'}catch(e){jobsTable.innerHTML=`<tr><td colspan="4" class="p-8 text-center text-red-600">${esc(e.message||'Backend unavailable')}</td></tr>`}}async function deleteJob(id){if(!confirm('Delete this job?'))return;const r=await fetch(`${API_URL}/api/jobs/${id}`,{method:'DELETE',headers:{Authorization:`Bearer ${localStorage.getItem('token')}`}});if(r.ok)loadStats();else alert('Delete failed')}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}loadStats()</script></body></html>
