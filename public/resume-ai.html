<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Resume Pro — USAJobsPro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-white"><header class="p-4 border-b flex justify-between"><b class="text-blue-600">✦ AI Resume Pro</b><a href="index.html">Back to Jobs</a></header><main class="max-w-5xl mx-auto p-6 grid md:grid-cols-2 gap-8"><section><h1 class="text-3xl font-bold">Tailor your resume</h1><p class="text-gray-500 mt-2">Paste a job description and your current resume to calculate a keyword match.</p><textarea id="jobDesc" placeholder="Paste Job Description" class="w-full h-40 border p-3 rounded-xl mt-6"></textarea><textarea id="resume" placeholder="Paste Current Resume" class="w-full h-56 border p-3 rounded-xl mt-3"></textarea><button onclick="matchResume()" class="w-full bg-black text-white p-3 rounded-xl mt-4 font-bold">Analyze with AI</button></section><section class="bg-gray-50 p-6 rounded-2xl border"><h2 class="font-bold">Result</h2><div id="output" class="mt-4 bg-white p-4 rounded-xl min-h-[300px] border whitespace-pre-wrap">Your result will appear here.</div><p class="text-xs text-gray-500 mt-3">This version provides keyword matching. Connect an AI provider on the secure backend for generated resume text.</p></section></main><script>const API_URL='https://usajobspro.onrender.com';async function matchResume(){const token=localStorage.getItem('token');if(!token){location.href='login.html';return}output.textContent='Analyzing...';try{const r=await fetch(`${API_URL}/api/ai-match`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({jobDescription:jobDesc.value,resumeText:resume.value})});const d=await r.json();if(!r.ok)throw Error(d.message);output.textContent=`MATCH SCORE: ${d.matchScore}\n\nSUGGESTION: ${d.suggestion}`}catch(e){output.textContent=e.message||'Unable to connect to backend.'}}</script></body></html>
