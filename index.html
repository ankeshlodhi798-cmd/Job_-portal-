<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>USAJobsPro — Find Jobs Across USA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900">
<header class="bg-white shadow-sm sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
<a href="index.html" class="text-2xl font-bold text-blue-600"><i class="fa-solid fa-briefcase"></i> USAJobsPro</a>
<div class="flex gap-2"><a href="login.html" class="px-4 py-2 border border-blue-600 text-blue-600 rounded-lg">Login</a><button onclick="openPost()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Post a Job</button></div>
</div></header>
<section class="bg-blue-600 py-12"><div class="max-w-7xl mx-auto px-4 text-center"><h1 class="text-4xl md:text-5xl font-bold text-white mb-3">Find Your Dream Job</h1><p class="text-blue-100 mb-7">Search jobs by keyword, company, location and work type.</p>
<div class="bg-white p-3 rounded-xl flex flex-col md:flex-row gap-3 max-w-5xl mx-auto shadow-lg"><input id="search" type="text" placeholder="Job title, keyword or company" class="flex-1 px-4 py-3 border rounded-lg outline-none"><input id="location" type="text" placeholder="Location or Remote" class="flex-1 px-4 py-3 border rounded-lg outline-none"><select id="type" class="px-4 py-3 border rounded-lg"><option value="">All types</option><option>Remote</option><option>Hybrid</option><option>On-site</option><option>Full-time</option></select><button onclick="loadJobs()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold">Search</button></div></div></section>
<main class="max-w-7xl mx-auto px-4 py-8 grid md:grid-cols-4 gap-6">
<aside class="bg-white p-5 rounded-xl shadow h-fit"><h3 class="font-bold mb-4">Filters</h3><label class="block mb-3"><input class="mr-2" type="checkbox" value="Remote" onchange="loadJobs()">Remote</label><label class="block mb-3"><input class="mr-2" type="checkbox" value="Full-time" onchange="loadJobs()">Full-time</label><label class="block mb-4"><input class="mr-2" type="checkbox" value="International" onchange="loadJobs()">International</label><a href="resume-ai.html" class="block bg-gray-900 text-white text-center px-4 py-3 rounded-lg">AI Resume Pro</a></aside>
<section class="md:col-span-3"><div class="flex justify-between items-center mb-4"><div><h2 class="text-2xl font-bold">Latest Jobs</h2><p id="status" class="text-sm text-gray-500"></p></div><button onclick="loadJobs()" class="border px-3 py-2 rounded-lg">Refresh</button></div><div id="jobs" class="space-y-4"></div></section>
</main>
<footer class="bg-gray-900 text-gray-300 mt-10 py-8 text-center">© 2026 USAJobsPro · Job search, applications and employer listings</footer>
<div id="postModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl p-6 w-full max-w-lg"><div class="flex justify-between"><h2 class="text-2xl font-bold">Post a Job</h2><button onclick="closePost()">✕</button></div><p class="text-sm text-gray-500 my-3">Employer posting requires a logged-in employer account.</p><div class="space-y-3"><input id="jt" class="w-full border p-3 rounded-lg" placeholder="Job title"><input id="jc" class="w-full border p-3 rounded-lg" placeholder="Company"><input id="jl" class="w-full border p-3 rounded-lg" placeholder="Location"><select id="jtype" class="w-full border p-3 rounded-lg"><option>Remote</option><option>Full-time</option><option>Hybrid</option><option>On-site</option></select><input id="jsalary" class="w-full border p-3 rounded-lg" placeholder="Salary"><textarea id="jdesc" class="w-full border p-3 rounded-lg" placeholder="Description"></textarea><button onclick="postJob()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">Continue to Payment / Post</button><p id="postMsg" class="text-sm text-center"></p></div></div></div>
<script>
const API_URL='https://usajobspro.onrender.com';
const fallbackJobs=[
{_id:'demo1',title:'AI Resume Specialist',company:'USAJobsPro Demo',location:'Remote, USA',salary:'$80k - $120k',description:'Help job seekers tailor ATS-friendly resumes.',type:'Remote',isPremium:true},
{_id:'demo2',title:'Customer Support Specialist',company:'SupportHub',location:'Remote, USA',salary:'$45k - $65k',description:'Email and chat support for customers.',type:'Full-time',isPremium:false},
{_id:'demo3',title:'Frontend Developer',company:'Nova Digital',location:'Austin, TX',salary:'$70k - $110k',description:'Build modern web experiences.',type:'Hybrid',isPremium:false}
];
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function loadJobs(){const q=document.getElementById('search').value.trim(),loc=document.getElementById('location').value.trim(),type=document.getElementById('type').value;const params=new URLSearchParams();if(q)params.set('search',q);if(loc)params.set('location',loc);if(type)params.set('type',type);document.getElementById('status').textContent='Loading...';let data=[];try{const r=await fetch(`${API_URL}/api/jobs?${params}`);if(!r.ok)throw Error();data=await r.json()}catch(e){data=fallbackJobs.filter(j=>(!q||`${j.title} ${j.company}`.toLowerCase().includes(q.toLowerCase()))&&(!loc||j.location.toLowerCase().includes(loc.toLowerCase()))&&(!type||j.type===type));document.getElementById('status').textContent='Demo jobs shown — connect the live backend to load database jobs.'}const checks=[...document.querySelectorAll('aside input:checked')].map(x=>x.value);if(checks.length)data=data.filter(j=>checks.includes(j.type)||checks.includes('International')&&/international|student/i.test(j.description||''));renderJobs(data)}
function renderJobs(data){document.getElementById('status').textContent=document.getElementById('status').textContent||`${data.length} jobs found`;document.getElementById('jobs').innerHTML=data.length?data.map(j=>`<article class="bg-white p-5 rounded-xl shadow hover:shadow-md"><div class="flex justify-between gap-3"><div><h3 class="text-lg font-bold">${esc(j.title)}</h3><p class="text-gray-500">${esc(j.company||'Company')} · ${esc(j.location||'USA')}</p></div>${j.isPremium?'<span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full h-fit">Premium</span>':''}</div><div class="flex flex-wrap gap-2 my-3"><span class="bg-gray-100 px-3 py-1 rounded-full text-xs">${esc(j.type||'Full-time')}</span><span class="bg-gray-100 px-3 py-1 rounded-full text-xs">${esc(j.salary||'Salary disclosed by employer')}</span></div><p class="text-sm text-gray-700">${esc(j.description||'No description provided.')}</p><div class="mt-4 flex gap-2"><button onclick="applyJob('${esc(j._id)}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Apply Now</button><button onclick="saveJob('${esc(j._id)}')" class="border px-4 py-2 rounded-lg text-sm">Save</button></div></article>`).join(''):'<div class="bg-white rounded-xl p-10 text-center text-gray-500">No jobs found. Try another search.</div>'}
function applyJob(id){localStorage.setItem('applyJobId',id);location.href='login.html?apply='+encodeURIComponent(id)}function saveJob(id){let a=JSON.parse(localStorage.getItem('savedJobs')||'[]');if(!a.includes(id))a.push(id);localStorage.setItem('savedJobs',JSON.stringify(a));alert('Job saved.')}
function openPost(){document.getElementById('postModal').classList.remove('hidden');document.getElementById('postModal').classList.add('flex')}function closePost(){document.getElementById('postModal').classList.add('hidden');document.getElementById('postModal').classList.remove('flex')}
async function postJob(){const token=localStorage.getItem('token');if(!token){location.href='login.html?next=post';return}const body={title:jt.value,company:jc.value,location:jl.value,salary:jsalary.value,description:jdesc.value,type:jtype.value};try{const r=await fetch(`${API_URL}/api/jobs`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(body)});const d=await r.json();document.getElementById('postMsg').textContent=d.message||'Job posted';if(r.ok){closePost();loadJobs()}}catch(e){document.getElementById('postMsg').textContent='Backend unavailable. Please try again later.'}}
loadJobs();
</script></body></html>
